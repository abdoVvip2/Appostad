<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد تقارير المشرف التربوي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --green: #27ae60; --yellow: #f1c40f; --blue: #3498db;
            --red: #e74c3c; --black: #2c3e50; --gray: #7f8c8d;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; margin: 0; padding: 10px; }
        .container { max-width: 850px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .main-header { background: var(--black); color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--blue); }
        .main-header h1 { margin: 0; font-size: 1.4rem; }
        .section { padding: 20px; border-bottom: 1px solid #eee; }
        .section-title { display: flex; align-items: center; gap: 10px; font-weight: 900; margin-bottom: 15px; font-size: 1rem; color: #2c3e50; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: 'Cairo'; }

        /* التنسيقات اللونية */
        .sec-1 { border-right: 5px solid var(--green); }
        .sec-2 { border-right: 5px solid var(--yellow); }
        .sec-3 { border-right: 5px solid var(--red); background: #fffafa; }
        .sec-4 { border-right: 5px solid var(--gray); }

        .btn-area { padding: 20px; display: flex; gap: 10px; background: #fff; flex-wrap: wrap; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Cairo'; font-size: 1rem; transition: 0.3s; }
        .btn-download { background: var(--blue); color: white; }
        .btn-print { background: var(--black); color: white; }
        .btn-reset { background: var(--gray); color: white; }

        @media print { .btn-area { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <div class="main-header">
        <h1>📓 مولد تقارير المشرف التربوي</h1>
        <p style="margin:5px 0 0; font-size:0.9rem;">أدخل البيانات واضغط تحميل لاستخراج الوثيقة</p>
    </div>

    <div class="section sec-1">
        <div class="section-title">🟢 1. المعلومات العامة</div>
        <div class="grid">
            <div><label>📅 التاريخ</label><input type="date" id="date"></div>
            <div><label>🏫 المؤسسة</label><input type="text" id="school" placeholder="اسم المؤسسة"></div>
        </div>
        <div style="margin-top:10px;">
            <label>👤 اسم المشرف</label>
            <input type="text" id="supervisor" placeholder="اسم المشرف القائم بالتقرير">
        </div>
    </div>

    <div class="section sec-2">
        <div class="section-title">🟡 2. الغيابات</div>
        <div class="grid">
            <div><label>عدد التلاميذ الغائبين</label><input type="number" id="absCount"></div>
            <div><label>غياب الأساتذة</label><input type="text" id="profAbs" placeholder="اسم الأستاذ والمادة"></div>
        </div>
        <div style="margin-top:10px;">
            <label>تفاصيل وأسماء الغائبين</label>
            <textarea id="absNames" rows="2"></textarea>
        </div>
    </div>

    <div class="section sec-3">
        <div class="section-title">🔴 3. الانضباط والحوادث</div>
        <textarea id="incidents" rows="3" placeholder="سجل أي تأخر، شجار، أو مشكلة حدثت اليوم..."></textarea>
    </div>

    <div class="section sec-4">
        <div class="section-title">⚪ 4. الملاحظات الختامية</div>
        <textarea id="finalNotes" rows="2" placeholder="ملاحظات عامة حول سير العمل..."></textarea>
    </div>

    <div class="btn-area">
        <button class="btn-download" onclick="generateAndDownloadFile()">📥 تحميل التقرير (ملف)</button>
        <button class="btn-print" onclick="window.print()">🖨️ طباعة</button>
        <button class="btn-reset" onclick="resetForm()">🧹 إفراغ الحقول</button>
    </div>
</div>

<script>
    // ضبط تاريخ اليوم تلقائياً
    document.getElementById('date').valueAsDate = new Date();

    function generateAndDownloadFile() {
        // 1. جلب البيانات من الحقول
        const date = document.getElementById('date').value || 'غير محدد';
        const school = document.getElementById('school').value || 'غير محدد';
        const supervisor = document.getElementById('supervisor').value || 'غير محدد';
        const absCount = document.getElementById('absCount').value || '0';
        const profAbs = document.getElementById('profAbs').value || 'لا يوجد';
        const absNames = document.getElementById('absNames').value || 'لا يوجد تفاصيل';
        const incidents = document.getElementById('incidents').value || 'لا يوجد حوادث مسجلة';
        const finalNotes = document.getElementById('finalNotes').value || 'لا توجد ملاحظات إضافية';

        // 2. تنسيق محتوى الملف النصي
        const fileContent = `
=============================================
         التقرير اليومي للمشرف التربوي         
=============================================

التاريخ: ${date}
المؤسسة: ${school}
اسم المشرف: ${supervisor}

---------------------------------------------
[ الغيابات ]
- عدد التلاميذ الغائبين: ${absCount}
- أسماء التلاميذ الغائبين:
${absNames}

- غياب الأساتذة: 
${profAbs}

---------------------------------------------
[ الانضباط والحوادث ]
${incidents}

---------------------------------------------
[ الملاحظات العامة ]
${finalNotes}

=============================================
تم التوليد بواسطة النظام الرقمي للمشرفين.
        `;

        // 3. إنشاء الملف وتحميله برمجياً (تقنية Blob)
        const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        // ضبط اسم الملف بناءً على التاريخ واسم المؤسسة
        link.href = url;
        link.download = `تقرير_${school}_${date}.txt`; 
        
        document.body.appendChild(link);
        link.click();
        
        // تنظيف الذاكرة بعد التحميل
        window.URL.revokeObjectURL(url);
        document.body.removeChild(link);
    }

    function resetForm() {
        if(confirm("هل أنت متأكد من مسح جميع البيانات المدخلة؟")) {
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                if (input.type !== 'date') input.value = '';
            });
            document.getElementById('date').valueAsDate = new Date();
        }
    }
</script>

</body>
</html>
