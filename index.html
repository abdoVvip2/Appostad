<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز تحميل التقارير</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader-card {
            background: white;
            padding: 30px;
            border-radius: 12 padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #3498db;
        }
        .btn-direct {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            font-family: 'Cairo';
        }
    </style>
</head>
<body>

<div class="loader-card">
    <h2 id="status">جاري معالجة التقرير...</h2>
    <p id="details">يرجى الانتظار لحظة لبدء التحميل تلقائياً.</p>
    <button id="manualBtn" class="btn-direct" style="display:none;" onclick="downloadAction()">تحميل يدوي إذا لم يبدأ</button>
</div>

<script>
    let reportData = null;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');

        if (!encodedData) {
            document.getElementById('status').innerText = "⚠️ خطأ في البيانات";
            document.getElementById('details').innerText = "لم يتم العثور على بيانات تقرير صالحة لإتمام التحميل.";
            return;
        }

        try {
            // فك التشفير
            const decodedJSON = decodeURIComponent(escape(atob(encodedData)));
            reportData = JSON.parse(decodedJSON);

            document.getElementById('status').innerText = "✅ التقرير جاهز";
            document.getElementById('details').innerText = "بدأ تحميل ملف: " + (reportData.school || "تقرير") + ".txt";
            document.getElementById('manualBtn').style.display = "inline-block";

            // تشغيل التحميل التلقائي
            downloadAction();

        } catch (e) {
            document.getElementById('status').innerText = "❌ فشل المعالجة";
            document.getElementById('details').innerText = "حدث خطأ أثناء فك تشفير بيانات التقرير.";
        }
    };

    function downloadAction() {
        if (!reportData) return;

        const content = `
=============================================
         التقرير اليومي للمشرف التربوي         
=============================================
التاريخ: ${reportData.date}
المؤسسة: ${reportData.school}
المشرف: ${reportData.supervisor}
---------------------------------------------
[ الغيابات ]
عدد التلاميذ: ${reportData.absCount}
الأقسام: ${reportData.absClasses}
الأسماء: ${reportData.absNames}
غياب الأساتذة: ${reportData.profAbs}
---------------------------------------------
[ الانضباط والحوادث ]
الحالة: ${reportData.disc1 ? 'شجار ' : ''}${reportData.disc2 ? 'تأخر ' : ''}${reportData.disc3 ? 'خروج بدون إذن' : ''}
ملاحظات الانضباط: ${reportData.discNote || 'لا يوجد'}
الحوادث: ${reportData.incidents}
---------------------------------------------
[ سير الدروس ]
ملاحظات عامة: ${reportData.finalNotes}
---------------------------------------------
[ معلومات إضافية ]
${reportData.extraTitle}: ${reportData.extraDetail}
إضافات أخرى: ${reportData.extraLong}
=============================================
        `;

        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `تقرير_${reportData.school || 'مؤسسة'}_${reportData.date}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
    <div class="btn-area">
        <button class="btn-download" onclick="generateAndDownloadFile()">📥 تحميل التقرير (ملف)</button>
        <button class="btn-print" onclick="window.print()">🖨️ طباعة</button>
        <button class="btn-reset" onclick="resetForm()">🧹 إفراغ الحقول</button>
    </div>
</div>

<script>
    // ضبط تاريخ اليوم تلقائياً
    document.getElementById('date').valueAsDate = new Date();

    function generateAndDownloadFile() {
        // 1. جلب البيانات من الحقول
        const date = document.getElementById('date').value || 'غير محدد';
        const school = document.getElementById('school').value || 'غير محدد';
        const supervisor = document.getElementById('supervisor').value || 'غير محدد';
        const absCount = document.getElementById('absCount').value || '0';
        const profAbs = document.getElementById('profAbs').value || 'لا يوجد';
        const absNames = document.getElementById('absNames').value || 'لا يوجد تفاصيل';
        const incidents = document.getElementById('incidents').value || 'لا يوجد حوادث مسجلة';
        const finalNotes = document.getElementById('finalNotes').value || 'لا توجد ملاحظات إضافية';

        // 2. تنسيق محتوى الملف النصي
        const fileContent = `
=============================================
         التقرير اليومي للمشرف التربوي         
=============================================

التاريخ: ${date}
المؤسسة: ${school}
اسم المشرف: ${supervisor}

---------------------------------------------
[ الغيابات ]
- عدد التلاميذ الغائبين: ${absCount}
- أسماء التلاميذ الغائبين:
${absNames}

- غياب الأساتذة: 
${profAbs}

---------------------------------------------
[ الانضباط والحوادث ]
${incidents}

---------------------------------------------
[ الملاحظات العامة ]
${finalNotes}

=============================================
تم التوليد بواسطة النظام الرقمي للمشرفين.
        `;

        // 3. إنشاء الملف وتحميله برمجياً (تقنية Blob)
        const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        // ضبط اسم الملف بناءً على التاريخ واسم المؤسسة
        link.href = url;
        link.download = `تقرير_${school}_${date}.txt`; 
        
        document.body.appendChild(link);
        link.click();
        
        // تنظيف الذاكرة بعد التحميل
        window.URL.revokeObjectURL(url);
        document.body.removeChild(link);
    }

    function resetForm() {
        if(confirm("هل أنت متأكد من مسح جميع البيانات المدخلة؟")) {
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                if (input.type !== 'date') input.value = '';
            });
            document.getElementById('date').valueAsDate = new Date();
        }
    }
</script>

</body>
</html>
