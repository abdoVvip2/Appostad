<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل التقرير PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        #pdf-content { position: absolute; left: -9999px; width: 700px; padding: 40px; background: white; color: black; text-align: right; direction: rtl; }
        .btn-pdf { background: #e74c3c; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="status">جاري تجهيز ملف PDF...</h2>
    <button class="btn-pdf" id="downloadBtn" style="display:none;" onclick="generatePDF()">تحميل PDF الآن</button>
</div>

<div id="pdf-content">
    <h1 style="text-align:center; border-bottom: 2px solid #000; padding-bottom: 10px;">التقرير اليومي للمشرف التربوي</h1>
    <p><strong>التاريخ:</strong> <span id="p-date"></span></p>
    <p><strong>المؤسسة:</strong> <span id="p-school"></span></p>
    <p><strong>المشرف:</strong> <span id="p-supervisor"></span></p>
    <hr>
    <h3>الغيابات:</h3>
    <p>عدد التلاميذ: <span id="p-absCount"></span> | الأقسام: <span id="p-absClasses"></span></p>
    <p>الأسماء: <span id="p-absNames"></span></p>
    <hr>
    <h3>الانضباط والحوادث:</h3>
    <p id="p-incidents"></p>
    <hr>
    <h3>الملاحظات الختامية:</h3>
    <p id="p-notes"></p>
</div>

<script>
    let reportData = null;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');

        if (encodedData) {
            try {
                const decodedJSON = decodeURIComponent(escape(atob(encodedData)));
                reportData = JSON.parse(decodedJSON);
                
                // ملء البيانات في القالب المخفي
                document.getElementById('p-date').innerText = reportData.date;
                document.getElementById('p-school').innerText = reportData.school;
                document.getElementById('p-supervisor').innerText = reportData.supervisor;
                document.getElementById('p-absCount').innerText = reportData.absCount;
                document.getElementById('p-absClasses').innerText = reportData.absClasses;
                document.getElementById('p-absNames').innerText = reportData.absNames;
                document.getElementById('p-incidents').innerText = reportData.incidents;
                document.getElementById('p-notes').innerText = reportData.notes || reportData.finalNotes;

                document.getElementById('status').innerText = "✅ الملف جاهز للتحميل";
                document.getElementById('downloadBtn').style.display = "inline-block";
                
                // بدء التحميل تلقائياً
                setTimeout(generatePDF, 1000);
            } catch (e) {
                document.getElementById('status').innerText = "❌ خطأ في معالجة البيانات";
            }
        }
    };

    function generatePDF() {
        const element = document.getElementById('pdf-content');
        const opt = {
            margin:       1,
            filename:     `تقرير_${reportData.school}_${reportData.date}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
